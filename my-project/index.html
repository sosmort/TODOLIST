  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"

  <title>To Do List</title>
  <style>
    body {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body class="h-screen flex justify-center ">
  <div class="mx-auto max-w-[780px] px-4 w-full relative">
    <div class="container pt-10 flex flex-col gap-[18px] h-fit">
      <h1 class="text-xl sm:text-2xl md:text-[26px] font-medium  uppercase text-center font-roboto">
        Todo List
      </h1>
      <!-- <div class="field flex gap-3"> -->
      <div class="field flex flex-col sm:flex-row gap-3">
        <div class="input_container relative flex-1">
          <svg
            class="field__button  absolute top-1/2 left-[12px] -translate-y-1/2 w-[21px] h-[21px] bg-transparent z-1 cursor-pointer"
            width="21" height="22" viewBox="0 0 21 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path

              fill="#6C63FF"></path>
          </svg>
          <input class="
          searchNote
          border border-[#6c63ff]
          rounded-[5px]
          flex
          font-inter
          text-base
          font-medium
          h-10
          w-full
          outline outline-3 outline-transparent
          px-[46px]
          relative
          transition-[outline,border,color,background-color]
          duration-200
          ease-in-out
          focus:outline focus:outline-3 focus:outline-[#6c63ff66]

        " type="text" placeholder="Search note ...">
        </div>
        <div class="relative w-full sm:w-[120px]">
          <button id="dropdownBtn" class="h-10 px-3 w-full bg-[#6c63ff] 
               border-2 border-[#6c63ff] 
               text-[#f7f7f7] 
               rounded-[5px] 
               cursor-pointer 
               flex items-center justify-center 
               shrink-0">
            <span id="dropdownLabel" class="uppercase">all</span>
          </button>

          <ul id="menu" class="absolute top-full right-0 mt-1 py-3 rounded-lg shadow-md
                   scale-y-0 origin-top transition duration-200 z-50 bg-white text-center w-full">

            <li class="dropdown-item px-4 py-2 uppercase cursor-pointer">all</li>
            <li class="dropdown-item px-4 py-2 uppercase cursor-pointer">complete</li>
            <li class="dropdown-item px-4 py-2 uppercase cursor-pointer">incomplete</li>
          </ul>
        </div>

        <button id="themeToggle" class=" w-10 h-10 rounded-full  absolute top-4 right-3 sm:static
               flex items-center justify-center text-white shadow-md
               hover:scale-105 transition">
          🌙
        </button>

      </div>
    </div>
    <div class="main flex-auto gap-2 max-w-[550px] py-6 mx-auto">
      <div class="list_container ">
        <!-- <div class="note_parent">
           <div class="note h-[61px]  font-kanit">
            <label
              class="note_checkbox flex items-center gap-[17px] cursor-pointer select-none border-b border-[rgba(108,99,255,.5)] py-[17px]">
              <input type="checkbox" class="peer hidden">
              <span class="checkmark"></span>
              <div
                class="note_text text-[#252525] text-[20px] font-medium peer-checked:line-through peer-checked:opacity-60">
                Sign up for training
              </div>
            </label>
            <label
              class="note_checkbox flex items-center gap-[17px] cursor-pointer select-none border-b border-[rgba(108,99,255,.5)] py-[17px]">
              <input type="checkbox" class="peer hidden">
              <span class="checkmark"></span>
              <div
                class="note_text text-[#252525] text-[20px] font-medium peer-checked:line-through peer-checked:opacity-60">
                Read books
              </div>
            </label>


          </div> 
        </div> -->
        <div class="empty_state"><img src="/empty_state.png" alt="" class="w-full max-w-60">
          <p class="empty_message">Oops... it's empty :( </p>
        </div>
      </div>
    </div>
    <button class="cross fixed bottom-8 md:right-[calc(50vw-372px)] right-5  z-[98] flex items-center justify-center w-[50px] h-[50px] rounded-full bg-[#6c63ff] border-2 border-[#6c63ff]
        shadow-[0_0_4px_0_#6c63ff]
    
        text-[#f7f7f7]
        font-kanit
        text-[18px]
        font-medium
        uppercase
    
        transition
        duration-200
        ease-in-out
    
        hover:shadow-[0_0_8px_0_#6c63ff]
        cursor-pointer
      ">
      <svg class="w-6 h-6 rotate-45" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 5L5 19M5.00001 5L19 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

    <div class="note_toast hidden">
      <div
        class="
        popup_card fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2  z-99 font-kanit
        border border-transparent rounded-[16px] flex flex-col gap-[25px] h-[250px] min-h-[200px] max-w-[500px] w-full overflow-hidden px-[30px] py-[18px]">
        <h2 class="popup__title text-xl sm:text-2xl md:text-[26px] font-medium  uppercase text-center font-roboto">
          New Note</h2>
        <form id="add_note" class="flex flex-auto flex-col gap-[25px]">
          <input class="todo_input  border border-[#6c63ff] rounded-[5px]  font-inter text-base font-medium h-[40px]
          outline outline-3 outline-transparent
          px-[46px]
          relative
          transition-[outline,border,color,background-color]
          duration-200
          ease-in-out
          focus:outline focus:outline-3 focus:outline-[#6c63ff66]" type="text" placeholder="New note">
          <div class="popup__buttons flex justify-between mt-auto w-full ">
            <div
              class="popup_cancel_button flex items-center h-9.5 py-2 px-[22px] rounded-lg border text-[18px] border-[#6c63ff] capitalize cursor-pointer text-[#534cc2]">
              cancel
            </div>
            <button
              class="popup_apply_button flex items-center h-9.5 py-2 px-5.5 rounded-lg border text-[18px] border-[#6c63ff] capitalize cursor-pointer text-white bg-[#534cc2]"
              type="submit">
              apply
            </button>
          </div>
        </form>
      </div>

      <div
        class="layer fixed top-0 left-0 h-full w-full z-98 transition-[width] duration-800 ease-in-out bg-black/50 backdrop-blur-[5px]">
      </div>
    </div>


  </div>

  <script type="module" src="/src/main.js"></script>




</body>
