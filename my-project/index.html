              fill="#6C63FF"></path>
          </svg>
          <input class="
          bg-[#f7f7f7]
          border border-[#6c63ff]
          rounded-[5px]
          text-[#6c63ff]
          flex
          font-inter
          text-base
          font-medium
          h-10
          w-full
          outline outline-3 outline-transparent
          px-[46px]
          relative
          transition-[outline,border,color,background-color]
          duration-200
          ease-in-out
          focus:outline focus:outline-3 focus:outline-[#6c63ff66]

        " type="text" placeholder="Search note ...">
        </div>
        <button id="dropdownBtn" class="relative border px-3 py-1 w-[120px] bg-[#f7f7f7]
        border border-[#6c63ff]
        rounded-[5px]
        text-[#6c63ff] cursor-pointer">
          <span id="dropdownLabel" class="uppercase">all</span>
          <ul id="menu"
            class="absolute top-full right-0 mt-1 py-3 rounded-lg shadow-md scale-y-0 origin-top transition duration-200">
            <li class="block px-4 py-2  text-[#6c63ff]
            transition cursor-pointer uppercase dropdown-item is-active ">all</li>
            <li class="block px-4 py-2  text-[#6c63ff]
            hover:bg-[#e2e0ff] 
            transition cursor-pointer uppercase">complete</li>
            <li class="block px-4 py-2  text-[#6c63ff]
             hover:bg-[#e2e0ff] 
             transition cursor-pointer uppercase">incomplete</li>
          </ul>
        </button>
      </div>
    </div>
    <div class="main flex-auto gap-2 max-w-[550px] py-6 mx-auto">
      <div class="list_container ">
        <div class="note_parent">
          <div class="note h-[61px] flex items-center gap-2">
            <div class="note_checkbox">
              <input type="checkbox">
            </div>
            <div class="note_text text-[#252525] text-[26px] font-medium">
              Note 1
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
